<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web AR - 6 Videos</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            z-index: 9999;
            text-align: center;
            padding: 20px;
        }
        /* บังคับไม่ให้กล้องซูม */
        video {
            object-fit: cover !important;
        }
    </style>
</head>
<body>
    <div id="loading">
        กำลังโหลด...<br>
        กรุณาอนุญาตให้ใช้กล้อง<br>
        และส่องไปที่รูปภาพ
    </div>
    
    <a-scene 
        embedded 
        arjs="sourceType: webcam; 
              sourceWidth:1280; 
              sourceHeight:960; 
              displayWidth:1280; 
              displayHeight:960; 
              debugUIEnabled: true;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true;"
        debug>
        
        <!-- Marker A → Video 1 -->
        <a-marker type="pattern" url="markers/A.patt">
            <a-video 
                src="videos/video1.mp4" 
                width="4" 
                height="2.25"
                position="0 0.5 0"
                rotation="-90 0 0"
                autoplay="true" 
                muted="true"
                loop="true">
            </a-video>
        </a-marker>

        <!-- Marker B → Video 2 -->
        <a-marker type="pattern" url="markers/B.patt">
            <a-video 
                src="videos/video2.mp4" 
                width="4" 
                height="2.25"
                position="0 0.5 0"
                rotation="-90 0 0"
                autoplay="true" 
                muted="true"
                loop="true">
            </a-video>
        </a-marker>

        <!-- Marker C → Video 3 -->
        <a-marker type="pattern" url="markers/C.patt">
            <a-video 
                src="videos/video3.mp4" 
                width="4" 
                height="2.25"
                position="0 0.5 0"
                rotation="-90 0 0"
                autoplay="true" 
                muted="true"
                loop="true">
            </a-video>
        </a-marker>

        <!-- Marker D → Video 4 -->
        <a-marker type="pattern" url="markers/D.patt">
            <a-video 
                src="videos/video4.mp4" 
                width="4" 
                height="2.25"
                position="0 0.5 0"
                rotation="-90 0 0"
                autoplay="true" 
                muted="true"
                loop="true">
            </a-video>
        </a-marker>

        <!-- Marker E → Video 5 -->
        <a-marker type="pattern" url="markers/E.patt">
            <a-video 
                src="videos/video5.mp4" 
                width="4" 
                height="2.25"
                position="0 0.5 0"
                rotation="-90 0 0"
                autoplay="true" 
                muted="true"
                loop="true">
            </a-video>
        </a-marker>

        <!-- Marker F → Video 6 -->
        <a-marker type="pattern" url="markers/F.patt">
            <a-video 
                src="videos/video6.mp4" 
                width="4" 
                height="2.25"
                position="0 0.5 0"
                rotation="-90 0 0"
                autoplay="true" 
                muted="true"
                loop="true">
            </a-video>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loading').style.display = 'none';
            }, 3000);
        });
    </script>
</body>
</html>
