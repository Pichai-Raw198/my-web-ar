<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web AR - MindAR Video</title>
    
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            text-align: center;
            padding: 20px;
        }
        #start-screen h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }
        #start-screen p {
            font-size: 16px;
            margin-bottom: 30px;
            max-width: 400px;
        }
        #start-btn {
            background: #fff;
            color: #667eea;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #start-btn:active {
            transform: scale(0.95);
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            color: #fff;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            z-index: 9998;
            text-align: center;
            padding: 20px;
        }
        #status {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 100;
            display: none;
        }
        /* ซ่อน VR button และ UI ทั้งหมด */
        .a-enter-vr, .a-vr-button, .a-frame-inspector, #VR-Button {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <h1>🎬 Web AR Video</h1>
        <p>ส่องกล้องไปที่รูปภาพ A-F เพื่อชมวิดีโอ</p>
        <button id="start-btn">เริ่มใช้งาน</button>
    </div>
    
    <div id="loading">กำลังโหลดระบบ AR...<br>กรุณารอสักครู่</div>
    <div id="status"></div>
    
    <!-- MindAR Scene -->
    <a-scene 
        mindar-image="imageTargetSrc: markers/targets.mind; 
                      autoStart: false;
                      maxTrack: 6;
                      filterMinCF: 0.001;
                      filterBeta: 0.001;
                      uiScanning: #scan-ui;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        camera="active: false">
        
        <a-assets>
            <video id="vid1" src="videos/video1.mp4" preload="auto" webkit-playsinline playsinline loop></video>
            <video id="vid2" src="videos/video2.mp4" preload="auto" webkit-playsinline playsinline loop></video>
            <video id="vid3" src="videos/video3.mp4" preload="auto" webkit-playsinline playsinline loop></video>
            <video id="vid4" src="videos/video4.mp4" preload="auto" webkit-playsinline playsinline loop></video>
            <video id="vid5" src="videos/video5.mp4" preload="auto" webkit-playsinline playsinline loop></video>
            <video id="vid6" src="videos/video6.mp4" preload="auto" webkit-playsinline playsinline loop></video>
        </a-assets>

        <!-- Target 0 (รูป A) → Video 1 -->
        <a-entity mindar-image-target="targetIndex: 0">
            <a-entity rotation="90 0 0" position="0 0 0">
                <a-video 
                    id="video1"
                    src="#vid1"
                    width="6" 
                    height="3.375">
                </a-video>
            </a-entity>
        </a-entity>

        <!-- Target 1 (รูป B) → Video 2 -->
        <a-entity mindar-image-target="targetIndex: 1">
            <a-entity rotation="90 0 0" position="0 0 0">
                <a-video 
                    id="video2"
                    src="#vid2"
                    width="6" 
                    height="3.375">
                </a-video>
            </a-entity>
        </a-entity>

        <!-- Target 2 (รูป C) → Video 3 -->
        <a-entity mindar-image-target="targetIndex: 2">
            <a-entity rotation="90 0 0" position="0 0 0">
                <a-video 
                    id="video3"
                    src="#vid3"
                    width="6" 
                    height="3.375">
                </a-video>
            </a-entity>
        </a-entity>

        <!-- Target 3 (รูป D) → Video 4 -->
        <a-entity mindar-image-target="targetIndex: 3">
            <a-entity rotation="90 0 0" position="0 0 0">
                <a-video 
                    id="video4"
                    src="#vid4"
                    width="6" 
                    height="3.375">
                </a-video>
            </a-entity>
        </a-entity>

        <!-- Target 4 (รูป E) → Video 5 -->
        <a-entity mindar-image-target="targetIndex: 4">
            <a-entity rotation="90 0 0" position="0 0 0">
                <a-video 
                    id="video5"
                    src="#vid5"
                    width="6" 
                    height="3.375">
                </a-video>
            </a-entity>
        </a-entity>

        <!-- Target 5 (รูป F) → Video 6 -->
        <a-entity mindar-image-target="targetIndex: 5">
            <a-entity rotation="90 0 0" position="0 0 0">
                <a-video 
                    id="video6"
                    src="#vid6"
                    width="6" 
                    height="3.375">
                </a-video>
            </a-entity>
        </a-entity>

        <a-camera active="true" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
        const startBtn = document.getElementById('start-btn');
        const startScreen = document.getElementById('start-screen');
        const loading = document.getElementById('loading');
        const status = document.getElementById('status');
        
        let arStarted = false;
        let currentPlayingVideo = null;
        
        startBtn.addEventListener('click', function() {
            startScreen.style.display = 'none';
            loading.style.display = 'flex';
            
            const scene = document.querySelector('a-scene');
            scene.systems['mindar-image-system'].start();
            
            setTimeout(function() {
                loading.style.display = 'none';
                arStarted = true;
                showStatus('📷 ส่องกล้องไปที่รูปภาพ วิธีการปฐมพยาบาล');
            }, 3000);
        });
        
        function showStatus(message) {
            status.textContent = message;
            status.style.display = 'block';
            setTimeout(function() {
                status.style.display = 'none';
            }, 3000);
        }
        
        function stopAllVideos() {
            const videos = ['vid1', 'vid2', 'vid3', 'vid4', 'vid5', 'vid6'];
            videos.forEach(function(vidId) {
                const video = document.getElementById(vidId);
                if (video) {
                    video.pause();
                    video.currentTime = 0;
                }
            });
            currentPlayingVideo = null;
        }
        
        function playVideo(videoId) {
            stopAllVideos();
            const video = document.getElementById(videoId);
            if (video) {
                video.currentTime = 0;
                video.play().then(function() {
                    currentPlayingVideo = videoId;
                }).catch(function(e) {
                    console.log('Play error:', e);
                });
            }
        }
        
        const targets = [0, 1, 2, 3, 4, 5];
        const videos = ['vid1', 'vid2', 'vid3', 'vid4', 'vid5', 'vid6'];
        
        targets.forEach(function(targetIndex) {
            const targetEl = document.querySelector(`[mindar-image-target="targetIndex: ${targetIndex}"]`);
            const videoId = videos[targetIndex];
            
            targetEl.addEventListener('targetFound', function() {
                console.log('Target found:', targetIndex);
                if (arStarted) {
                    playVideo(videoId);
                    showStatus('✅ จับรูปได้! กำลังเล่นวิดีโอ ' + (targetIndex + 1));
                }
            });
            
            targetEl.addEventListener('targetLost', function() {
                console.log('Target lost:', targetIndex);
                if (currentPlayingVideo === videoId) {
                    stopAllVideos();
                    showStatus('📷 ส่องกล้องเพื่อเล่นอีกครั้ง');
                }
            });
        });
    </script>
</body>
</html>
