<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web AR - 6 Videos</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            text-align: center;
            padding: 20px;
        }
        #start-screen h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }
        #start-screen p {
            font-size: 16px;
            margin-bottom: 30px;
            max-width: 400px;
        }
        #start-btn {
            background: #fff;
            color: #667eea;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #start-btn:active {
            transform: scale(0.95);
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            color: #fff;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            z-index: 9998;
        }
        #status {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 100;
            display: none;
        }
    </style>
</head>
<body>
    <!-- หน้าเริ่มต้น -->
    <div id="start-screen">
        <h1>🎬 Web AR Video</h1>
        <p>ส่องกล้องไปที่รูปภาพ A-F เพื่อชมวิดีโอ</p>
        <button id="start-btn">เริ่มใช้งาน</button>
    </div>
    
    <div id="loading">กำลังเปิดกล้อง...</div>
    <div id="status"></div>
    
    <a-scene 
        embedded 
        arjs="sourceType: webcam; 
              sourceWidth:1280; 
              sourceHeight:960; 
              displayWidth:1280; 
              displayHeight:960; 
              debugUIEnabled: false;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; antialias: true;">
        
        <!-- Marker A → Video 1 -->
        <a-marker type="pattern" url="markers/A.patt" id="markerA">
            <a-video 
                id="video1"
                src="videos/video1.mp4"
                width="6" 
                height="3.375"
                position="0 1 0"
                rotation="-90 0 0"
                loop="false">
            </a-video>
        </a-marker>

        <!-- Marker B → Video 2 -->
        <a-marker type="pattern" url="markers/B.patt" id="markerB">
            <a-video 
                id="video2"
                src="videos/video2.mp4"
                width="6" 
                height="3.375"
                position="0 1 0"
                rotation="-90 0 0"
                loop="false">
            </a-video>
        </a-marker>

        <!-- Marker C → Video 3 -->
        <a-marker type="pattern" url="markers/C.patt" id="markerC">
            <a-video 
                id="video3"
                src="videos/video3.mp4"
                width="6" 
                height="3.375"
                position="0 1 0"
                rotation="-90 0 0"
                loop="false">
            </a-video>
        </a-marker>

        <!-- Marker D → Video 4 -->
        <a-marker type="pattern" url="markers/D.patt" id="markerD">
            <a-video 
                id="video4"
                src="videos/video4.mp4"
                width="6" 
                height="3.375"
                position="0 1 0"
                rotation="-90 0 0"
                loop="false">
            </a-video>
        </a-marker>

        <!-- Marker E → Video 5 -->
        <a-marker type="pattern" url="markers/E.patt" id="markerE">
            <a-video 
                id="video5"
                src="videos/video5.mp4"
                width="6" 
                height="3.375"
                position="0 1 0"
                rotation="-90 0 0"
                loop="false">
            </a-video>
        </a-marker>

        <!-- Marker F → Video 6 -->
        <a-marker type="pattern" url="markers/F.patt" id="markerF">
            <a-video 
                id="video6"
                src="videos/video6.mp4"
                width="6" 
                height="3.375"
                position="0 1 0"
                rotation="-90 0 0"
                loop="false">
            </a-video>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const startBtn = document.getElementById('start-btn');
        const startScreen = document.getElementById('start-screen');
        const loading = document.getElementById('loading');
        const status = document.getElementById('status');
        
        let arStarted = false;
        let currentPlayingVideo = null;
        
        // เมื่อผู้ใช้กดปุ่ม Start
        startBtn.addEventListener('click', function() {
            startScreen.style.display = 'none';
            loading.style.display = 'flex';
            
            // รอให้ AR โหลดเสร็จ
            setTimeout(function() {
                loading.style.display = 'none';
                arStarted = true;
                showStatus(' ส่องกล้องไปที่รูปภาพ A-F');
            }, 2000);
        });
        
        // ฟังก์ชันแสดงสถานะ
        function showStatus(message) {
            status.textContent = message;
            status.style.display = 'block';
            setTimeout(function() {
                status.style.display = 'none';
            }, 3000);
        }
        
        // ฟังก์ชันหยุดวิดีโอทั้งหมด
        function stopAllVideos() {
            const videos = ['video1', 'video2', 'video3', 'video4', 'video5', 'video6'];
            videos.forEach(function(vidId) {
                const videoEl = document.getElementById(vidId);
                if (videoEl) {
                    const video = videoEl.getObject3D('mesh');
                    if (video && video.video) {
                        video.video.pause();
                        video.video.currentTime = 0;
                    }
                }
            });
            currentPlayingVideo = null;
        }
        
        // ฟังก์ชันเล่นวิดีโอ
        function playVideo(videoId) {
            // หยุดวิดีโออื่นก่อน
            stopAllVideos();
            
            const videoEl = document.getElementById(videoId);
            if (videoEl) {
                const video = videoEl.getObject3D('mesh');
                if (video && video.video) {
                    video.video.currentTime = 0;
                    video.video.play().then(function() {
                        currentPlayingVideo = videoId;
                    }).catch(function(e) {
                        console.log('Play error:', e);
                    });
                }
            }
        }
        
        // ตั้งค่า event listeners สำหรับ markers
        const markers = ['A', 'B', 'C', 'D', 'E', 'F'];
        const videos = ['video1', 'video2', 'video3', 'video4', 'video5', 'video6'];
        
        markers.forEach(function(marker, index) {
            const markerEl = document.getElementById('marker' + marker);
            const videoId = videos[index];
            
            markerEl.addEventListener('markerFound', function() {
                if (arStarted) {
                    playVideo(videoId);
                    showStatus('▶️ วิดีโอ ' + (index + 1));
                }
            });
            
            markerEl.addEventListener('markerLost', function() {
                if (currentPlayingVideo === videoId) {
                    stopAllVideos();
                    showStatus('📷 ส่องกล้องเพื่อเล่นอีกครั้ง');
                }
            });
        });
    </script>
</body>
</html>
